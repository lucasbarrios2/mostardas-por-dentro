# Atualiza os dados e publica o site todos os dias.
#
# Por que assim:
# - Cada fonte é coletada numa etapa própria, que não derruba as outras se falhar. De 27/10 a
#   12/11/2026, o servidor do TCE-RS não respondeu e, com a coleta num passo só, nenhuma fonte
#   foi atualizada. Agora o site segue publicando com o último dado bom de cada fonte.
# - O alarme é o frescor (scripts/conferir_frescor.py): a execução fica vermelha quando uma fonte
#   passa do prazo, e não por uma oscilação de uma noite.
# - Os dados coletados entram como commit: o histórico do Git é a prova de quando cada
#   informação mudou (ARQUITETURA.md, decisões 3 e 11).
# - Se um teste ou a validação dos dados falhar, nada é publicado.
# - A publicação no Cloudflare só acontece depois que os segredos CLOUDFLARE_API_TOKEN e
#   CLOUDFLARE_ACCOUNT_ID forem cadastrados no repositório.

name: Atualizar e publicar

on:
  schedule:
    - cron: "30 10 * * *"   # 7h30 em Brasília, todos os dias
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-e-publicar
  cancel-in-progress: false

env:
  PROJETO_PAGES: ${{ vars.PROJETO_PAGES }}
  TEM_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
  COLETAR: ${{ github.event_name != 'push' }}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Coletar licitações e contratos (TCE-RS)
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python scripts/coletar_licitacon.py

      - name: Coletar pagamentos (TCE-RS)
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: |
          ano=$(date +%Y)
          python scripts/coletar_empenhos.py "$((ano - 1))"
          python scripts/coletar_empenhos.py "$ano"

      - name: Coletar empresas e sócios (Receita Federal)
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: python scripts/coletar_cnpj.py --max 200

      - name: Coletar gastos por área (Tesouro), no dia 1º de cada mês
        if: env.COLETAR == 'true'
        continue-on-error: true
        run: |
          if [ "$(date +%d)" = "01" ]; then python scripts/coletar_siconfi.py "$(( $(date +%Y) - 1 ))"; else echo "Só no dia 1º."; fi

      - name: Testar
        run: python -m unittest discover -s testes -v

      - name: Montar o site
        run: python scripts/construir_site.py

      - name: Guardar os dados coletados
        if: env.COLETAR == 'true'
        run: |
          git config user.name "coleta-automatica"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados bruto
          if git diff --cached --quiet; then
            echo "Nenhum dado mudou."
          else
            git commit -m "Atualiza dados: coleta automática de $(date +%d/%m/%Y)"
            git push
          fi

      - name: Publicar no Cloudflare Pages
        if: env.TEM_CLOUDFLARE == 'true' && env.PROJETO_PAGES != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJETO_PAGES" --production-branch=main || true
          npx --yes wrangler@4 pages deploy site --project-name="$PROJETO_PAGES" --branch=main --commit-dirty=true

      - name: Avisar que falta configurar o Cloudflare
        if: env.TEM_CLOUDFLARE != 'true' || env.PROJETO_PAGES == ''
        run: echo "::warning::Site montado, mas não publicado. Falta cadastrar CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (segredos) e PROJETO_PAGES (variável)."

      - name: Conferir se os dados estão em dia
        if: env.COLETAR == 'true'
        run: python scripts/conferir_frescor.py
